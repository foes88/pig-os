[project]
name = "pigos-api"
version = "0.1.0"
description = "PigOS — Global Swine Farm Management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "arq>=0.26",
    "email-validator>=2.0",
    "tzdata>=2026.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Style/modernization rules that conflict with the existing hand-formatted style.
# Real-bug rules (F-codes) stay enabled.
ignore = ["E501", "E701", "E702", "UP042", "UP046", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/models/*", "app/schemas/*"]
