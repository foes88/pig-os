  /api/v1/farms/{farm_id}/sync:
    post:
      tags:
      - Sync
      summary: Sync
      description: 'Bidirectional offline sync.


        **Push** (client → server):

        - Each item validated independently (per-item atomicity)

        - Returns: accepted / rejected / conflicts

        - Unresolved conflicts stored in conflict_queue for manual review


        **Pull** (server → client):

        - Returns all records changed since `last_sync_at`

        - Includes soft-deleted IDs for client to purge


        **dry_run=true**: validate only, no DB writes. Use before first real sync.


        **Conflict types**: DUPLICATE_EVENT | CYCLE_CONFLICT | STATUS_CONFLICT |

        PERIOD_LOCKED | SOW_NOT_FOUND | FUTURE_DATE'
      operationId: sync_api_v1_farms__farm_id__sync_post
      security:
      - HTTPBearer: []
      parameters:
      - name: farm_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Farm UUID
          title: Farm Id
        description: Farm UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
