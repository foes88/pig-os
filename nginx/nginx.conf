events { worker_connections 1024; }

http {
  # app.pigos.io → Next.js
  server {
    listen 80;
    server_name app.pigos.io;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name app.pigos.io;
    ssl_certificate     /etc/letsencrypt/live/app.pigos.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pigos.io/privkey.pem;
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # api.pigos.io → FastAPI
  server {
    listen 80;
    server_name api.pigos.io;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name api.pigos.io;
    ssl_certificate     /etc/letsencrypt/live/api.pigos.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pigos.io/privkey.pem;
    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
