services:

  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: pigos-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.pigos.io
      NEXT_PUBLIC_APP_URL: https://app.pigos.io
    expose:
      - "3000"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pigos-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    container_name: pigos-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: pigos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
      - api

volumes:
  redis_data:

networks:
  default:
    name: pigos-net
