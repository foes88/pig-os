services:

  web:
    build:
      context: ./src
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 는 빌드타임 인라인 → build args로 주입해야 클라 번들에 반영됨
        NEXT_PUBLIC_API_URL: https://api.pigos.io
        NEXT_PUBLIC_APP_URL: https://app.pigos.io
    container_name: pigos-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.pigos.io
      NEXT_PUBLIC_APP_URL: https://app.pigos.io
    expose:
      - "3000"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pigos-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # DB 커넥션 풀 예산 — Supavisor 세션 모드 한도 pool_size:15(실측 2026-08-20).
      # api 최대 10 + worker 최대 3 = 13(풀러 한도 15). pool_size 가 작으면 신규 연결이
      # 매번 발생해 응답이 느려진다 — 상시 커넥션을 넉넉히 잡는 게 우선.
      DB_POOL_SIZE: ${API_DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-2}
      # 선택 — 미설정 시 기능 graceful fallback
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      QBRIDGE_URL: ${QBRIDGE_URL:-}
      QBRIDGE_INBOUND_TOKEN: ${QBRIDGE_INBOUND_TOKEN:-}
      QBRIDGE_SERVICE_TOKEN: ${QBRIDGE_SERVICE_TOKEN:-}
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis

  # ARQ 백그라운드 워커 (G3) — KPI 집계 + Task 자동배정(05:30) + 알림 생성(06:00) cron
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pigos-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      # 워커는 배치성이라 api 보다 작게 — 풀러 슬롯을 사용자 트래픽에 양보한다.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-1}
    command: arq app.jobs.worker.WorkerSettings
    # worker는 HTTP 서버가 없으므로 api Dockerfile의 /health 헬스체크를 비활성화
    # (arq 프로세스는 redis 연결로 자체 동작 — false "unhealthy" 방지)
    healthcheck:
      disable: true
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: pigos-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: pigos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
      - api

volumes:
  redis_data:

networks:
  default:
    name: pigos-net
